<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balloon Hangman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #bfe6ff; --sky2: #eaf7ff; --grass: #7dcb6a; --ink: #2b2d42;
    --card: #ffffff; --accent: #ff7a59; --good: #34c759; --bad: #c9ced6; --gold: #ffc93c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Fredoka", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(var(--sky1), var(--sky2)); min-height: 100vh;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; }

  /* ---------- start screen ---------- */
  #start { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; text-align: center; }
  #start h1 { font-size: clamp(40px, 8vw, 72px); margin: 0 0 8px; color: var(--accent); text-shadow: 3px 3px 0 #fff; }
  #start p { font-size: 22px; margin: 0 0 32px; }
  .levels { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .level-btn {
    width: 260px; padding: 28px 20px; border-radius: 28px; background: var(--card);
    box-shadow: 0 8px 0 rgba(0,0,0,.12); transition: transform .1s; font-size: 20px; color: var(--ink);
  }
  .level-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .level-btn .big { font-size: 64px; display: block; }
  .level-btn strong { font-size: 30px; display: block; margin: 6px 0; }
  .level-btn.l5 { border: 5px solid #ffb347; }
  .level-btn.l8 { border: 5px solid #6c9bff; }

  /* ---------- game screen ---------- */
  #game { display: none; max-width: 1100px; margin: 0 auto; padding: 12px 16px 24px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pill { background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 20px; font-weight: 600; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .pill.btn:active { transform: translateY(2px); }
  .stage { display: grid; grid-template-columns: minmax(260px, 1fr) 1.4fr; gap: 20px; align-items: center; margin-top: 12px; }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }

  .sky { position: relative; height: 380px; background: rgba(255,255,255,.35); border-radius: 28px; overflow: hidden; }
  .sky svg { width: 100%; height: 100%; }
  .ground { position: absolute; bottom: 0; left: 0; right: 0; height: 46px; background: var(--grass); border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
  #floater { transition: transform 1.4s cubic-bezier(.5,0,.6,1.3); }
  .balloon { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite; }
  .balloon.popped { animation: pop .35s forwards; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); opacity: .8; } 100% { transform: scale(0); opacity: 0; } }
  .poof { font-size: 26px; font-weight: 700; fill: var(--accent); animation: poof .8s forwards; }
  @keyframes poof { to { opacity: 0; transform: translateY(-20px); } }
  .tries { position: absolute; top: 10px; left: 14px; font-size: 18px; font-weight: 600; }

  .panel { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .clue-card { background: var(--card); border-radius: 24px; padding: 14px 22px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.08); width: 100%; }
  #picture { font-size: 96px; line-height: 1.1; }
  #clue { font-size: 24px; }
  .speak-btn { background: var(--gold); border-radius: 999px; padding: 10px 22px; font-size: 22px; font-weight: 600; margin-top: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.12); color: var(--ink); }
  .speak-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.12); }

  #word { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .slot {
    width: 58px; height: 70px; border-bottom: 6px solid var(--ink); font-size: 50px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase;
  }
  .slot.show { animation: grow .3s; color: #1f7a3a; }
  .slot.missed { color: var(--accent); }
  @keyframes grow { from { transform: scale(.2); } }

  #keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; width: 100%; max-width: 620px; }
  .key {
    aspect-ratio: 1; font-size: clamp(22px, 4vw, 34px); font-weight: 700; border-radius: 16px;
    background: var(--card); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.14); text-transform: uppercase;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
  .key.right { background: var(--good); color: #fff; }
  .key.wrong { background: var(--bad); color: #fff; box-shadow: none; }
  .key:disabled { cursor: default; }

  #message { font-size: 32px; font-weight: 700; min-height: 44px; text-align: center; }
  #next { display: none; background: var(--accent); color: #fff; font-size: 28px; font-weight: 700; padding: 14px 40px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
  #next:active { transform: translateY(3px); }

  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 3px; pointer-events: none; animation: fall linear forwards; z-index: 10; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>

<section id="start">
  <h1>🎈 Balloon Hangman 🎈</h1>
  <p>Guess the letters before all the balloons pop!</p>
  <div class="levels">
    <button class="level-btn l5" data-level="little">
      <span class="big">🐣</span><strong>Little Kid</strong>Age 5 · short words · pictures
    </button>
    <button class="level-btn l8" data-level="big">
      <span class="big">🚀</span><strong>Big Kid</strong>Age 8 · longer words · clues
    </button>
  </div>
</section>

<section id="game">
  <div class="topbar">
    <button class="pill btn" id="home">🏠 Levels</button>
    <div class="pill" id="levelName"></div>
    <div class="pill">⭐ <span id="stars">0</span></div>
    <button class="pill btn" id="mute">🔊</button>
  </div>

  <div class="stage">
    <div class="sky">
      <div class="tries" id="tries"></div>
      <div class="ground"></div>
      <svg viewBox="0 0 300 380" id="svg">
        <g id="floater">
          <g id="balloons"></g>
          <!-- bear -->
          <g transform="translate(150 270)">
            <circle cx="-26" cy="-34" r="13" fill="#a0673c"/><circle cx="26" cy="-34" r="13" fill="#a0673c"/>
            <circle cx="-26" cy="-34" r="6" fill="#e3b58a"/><circle cx="26" cy="-34" r="6" fill="#e3b58a"/>
            <ellipse cx="0" cy="40" rx="30" ry="32" fill="#a0673c"/>
            <ellipse cx="0" cy="46" rx="18" ry="20" fill="#e3b58a"/>
            <circle cx="0" cy="-10" r="34" fill="#b97a47"/>
            <ellipse cx="0" cy="2" rx="15" ry="11" fill="#e3b58a"/>
            <circle cx="-12" cy="-16" r="4.5" fill="#222"/><circle cx="12" cy="-16" r="4.5" fill="#222"/>
            <ellipse cx="0" cy="-3" rx="6" ry="4" fill="#222"/>
            <path id="mouth" d="M-7 6 Q0 13 7 6" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="-30" cy="16" rx="9" ry="16" fill="#a0673c" transform="rotate(30 -30 16)"/>
            <ellipse cx="30" cy="16" rx="9" ry="16" fill="#a0673c" transform="rotate(-30 30 16)"/>
          </g>
        </g>
        <g id="effects"></g>
      </svg>
    </div>

    <div class="panel">
      <div class="clue-card">
        <div id="picture"></div>
        <div id="clue"></div>
        <button class="speak-btn" id="hear"></button>
      </div>
      <div id="word"></div>
      <div id="message"></div>
      <button id="next">Next word ➜</button>
      <div id="keys"></div>
    </div>
  </div>
</section>

<script src="words.js"></script>
<script>
const COLORS = ["#ff5d73","#ffb347","#ffe066","#6be585","#5ec8ff","#9b7bff","#ff8fd8","#ff7a59"];

// ---------------- speech ----------------
let muted = false;
let player = new Audio();
const audioCache = new Map();

// On the hosted site every phrase is pre-recorded in audio/; locally we ask server.py.
const manifest = fetch("audio/manifest.json").then(r => r.ok ? r.json() : {}).catch(() => ({}));

function fetchSpeech(text) {
  if (!audioCache.has(text)) {
    audioCache.set(text, manifest
      .then(m => fetch(m[text] ? "audio/" + m[text] : "/api/tts?text=" + encodeURIComponent(text)))
      .then(r => { if (!r.ok) throw new Error("tts " + r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b))
      .catch(e => { audioCache.delete(text); throw e; }));
  }
  return audioCache.get(text);
}

let speakToken = 0;
async function speak(text) {
  if (muted) return;
  const token = ++speakToken;           // newest request wins
  player.pause(); speechSynthesis.cancel();
  try {
    const url = await fetchSpeech(text);
    if (token !== speakToken) return;
    player.src = url;
    await player.play();
  } catch (e) {
    if (token !== speakToken) return;
    // Fallback: the browser's built-in voice
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }
}


// ---------------- state ----------------
let level, entry, guessed, wrong, over, bag = [];
const $ = id => document.getElementById(id);

function loadStars(l) { try { return +localStorage.getItem("stars-" + l) || 0; } catch { return 0; } }
function saveStars(l, n) { try { localStorage.setItem("stars-" + l, n); } catch {} }

function pickWord() {
  if (!bag.length) bag = [...LEVELS[level].list].sort(() => Math.random() - .5);
  return bag.pop();
}

function startLevel(l) {
  level = l; bag = [];
  $("start").style.display = "none"; $("game").style.display = "block";
  $("levelName").textContent = LEVELS[l].name;
  $("stars").textContent = loadStars(l);
  newWord();
}

function newWord() {
  const raw = pickWord();
  entry = { word: raw[0], emoji: raw[1], clue: raw[2] };
  guessed = new Set(); wrong = 0; over = false;
  $("message").textContent = ""; $("next").style.display = "none";
  $("floater").style.transform = "";
  $("mouth").setAttribute("d", "M-7 6 Q0 13 7 6");

  if (level === "little") {
    $("picture").textContent = entry.emoji; $("picture").style.display = "";
    $("clue").textContent = "";
    $("hear").textContent = "🔈 Hear the word";
  } else {
    $("picture").style.display = "none";
    $("clue").textContent = "💡 " + entry.clue;
    $("hear").textContent = "🔈 Hear the clue";
  }
  drawBalloons(); drawWord(); drawKeys(); updateTries();
  speak(Say.intro(level, entry));
  // Warm up the end-of-round phrases so they play instantly.
  fetchSpeech(Say.win(entry)).catch(() => {});
}


function popBalloon() {
  const alive = [...document.querySelectorAll(".balloon:not(.popped)")];
  if (!alive.length) return;
  const b = alive[Math.floor(Math.random() * alive.length)];
  b.classList.add("popped");
  const e = b.querySelector("ellipse");
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", e.getAttribute("cx") - 22); t.setAttribute("y", e.getAttribute("cy"));
  t.setAttribute("class", "poof"); t.textContent = "POP!";
  $("effects").appendChild(t); setTimeout(() => t.remove(), 800);
  // Bear sinks a little with each pop.
  const frac = wrong / LEVELS[level].balloons;
  $("floater").style.transform = `translateY(${frac * 40}px)`;
}

function drawWord() {
  $("word").innerHTML = "";
  for (const ch of entry.word) {
    const s = document.createElement("div");
    s.className = "slot";
    if (guessed.has(ch)) { s.textContent = ch; s.classList.add("show"); }
    $("word").appendChild(s);
  }
}

function drawKeys() {
  $("keys").innerHTML = "";
  for (const ch of "abcdefghijklmnopqrstuvwxyz") {
    const k = document.createElement("button");
    k.className = "key"; k.textContent = ch; k.dataset.ch = ch;
    k.onclick = () => guess(ch);
    $("keys").appendChild(k);
  }
}

function updateTries() {
  const left = LEVELS[level].balloons - wrong;
  $("tries").textContent = "🎈 × " + left;
}

// ---------------- game logic ----------------
function guess(ch) {
  if (over || guessed.has(ch)) return;
  guessed.add(ch);
  const key = document.querySelector(`.key[data-ch="${ch}"]`);
  key.disabled = true;

  if (entry.word.includes(ch)) {
    key.classList.add("right");
    drawWord();
    if ([...entry.word].every(c => guessed.has(c))) return win();
    const count = [...entry.word].filter(c => c === ch).length;
    speak(Say.yes(ch, count));
  } else {
    key.classList.add("wrong");
    wrong++; popBalloon(); updateTries();
    if (wrong >= LEVELS[level].balloons) return lose();
    speak(Say.no(ch));
  }
}

function win() {
  over = true;
  const n = loadStars(level) + 1; saveStars(level, n); $("stars").textContent = n;
  $("message").textContent = "🎉 You did it! 🎉";
  if (level === "big") { $("picture").textContent = entry.emoji; $("picture").style.display = ""; }
  $("next").style.display = "inline-block";
  speak(Say.win(entry)); confetti();
}

function lose() {
  over = true;
  $("floater").style.transform = "translateY(70px)";   // bear lands softly on the grass
  $("mouth").setAttribute("d", "M-7 10 Q0 4 7 10");
  // Reveal the missing letters in orange.
  $("word").innerHTML = "";
  for (const ch of entry.word) {
    const s = document.createElement("div");
    s.className = "slot " + (guessed.has(ch) ? "show" : "missed"); s.textContent = ch;
    $("word").appendChild(s);
  }
  if (level === "big") { $("picture").textContent = entry.emoji; $("picture").style.display = ""; }
  $("message").textContent = "The word was " + entry.word.toUpperCase();
  $("next").style.display = "inline-block";
  speak(Say.lose(entry));
}

function confetti() {
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = COLORS[i % COLORS.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
    c.style.animationDelay = Math.random() * .5 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

// ---------------- wiring ----------------
document.querySelectorAll(".level-btn").forEach(b => b.onclick = () => startLevel(b.dataset.level));
$("home").onclick = () => { player.pause(); speechSynthesis.cancel(); $("game").style.display = "none"; $("start").style.display = "flex"; };
$("next").onclick = newWord;
$("hear").onclick = () => speak(Say.hear(level, entry));
$("mute").onclick = () => {
  muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊";
  if (muted) { player.pause(); speechSynthesis.cancel(); }
};
document.addEventListener("keydown", e => {
  if ($("game").style.display !== "block") return;
  const k = e.key.toLowerCase();
  if (/^[a-z]$/.test(k)) guess(k);
  else if (e.key === "Enter" && over) newWord();
});
</script>
</body>
</html>
